# Component D — Cloud Deployment Pipeline
# Builds the backend Docker image and pushes it to GitHub Container Registry (ghcr.io),
# then performs a rolling deploy via SSH to a cloud VM on every push to main.
#
# Required repository secrets:
#   DEPLOY_SSH_HOST       – cloud VM hostname or IP
#   DEPLOY_SSH_USER       – SSH login user
#   DEPLOY_SSH_KEY        – private SSH key (PEM)
#   DEPLOY_DB_CONN        – PostgreSQL connection string for the cloud DB
#   NOTIFICATIONS_EMAIL_ENDPOINT – live notification endpoint
#   NOTIFICATIONS_SMS_ENDPOINT   – live SMS endpoint
#   NOTIFICATIONS_API_KEY        – shared key for notification provider

name: Cloud Deployment Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'backend-api/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:     # allow manual trigger from GitHub UI

permissions:
  contents: read
  packages: write        # needed to push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/careflow-api

jobs:
  # ── 1. Build & test ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend-api/CareFlowAI.API.csproj

      - name: Build (Release)
        run: dotnet build backend-api/CareFlowAI.API.csproj --no-restore --configuration Release

      - name: Run all tests
        run: >
          dotnet test backend-api.Tests/CareFlowAI.API.Tests.csproj
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend-api.Tests/TestResults/*.trx

  # ── 2. Build & push Docker image ─────────────────────────────────────────────
  docker-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to cloud VM ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud VM
    runs-on: ubuntu-latest
    needs: docker-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            echo "==> Pulling latest image: $IMAGE"
            docker pull "$IMAGE"

            echo "==> Stopping old container (if running)"
            docker stop careflow-api 2>/dev/null || true
            docker rm   careflow-api 2>/dev/null || true

            echo "==> Starting new container"
            docker run -d \
              --name careflow-api \
              --restart unless-stopped \
              -p 5000:8080 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e "ConnectionStrings__DefaultConnection=${{ secrets.DEPLOY_DB_CONN }}" \
              -e "Notifications__EmailEndpoint=${{ secrets.NOTIFICATIONS_EMAIL_ENDPOINT }}" \
              -e "Notifications__SmsEndpoint=${{ secrets.NOTIFICATIONS_SMS_ENDPOINT }}" \
              -e "Notifications__ApiKey=${{ secrets.NOTIFICATIONS_API_KEY }}" \
              "$IMAGE"

            echo "==> Pruning dangling images"
            docker image prune -f

            echo "==> Health check"
            sleep 5
            curl -sf http://localhost:5000/health || (echo "Health check failed!" && exit 1)

            echo "==> Deployment complete"

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ CareFlow API deployed successfully to production."
          echo "   Image: ${{ needs.docker-push.outputs.image-tag }}"
          echo "   Commit: ${{ github.sha }}"
