name: Flutter Component B CI

on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['mobile_app/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['mobile_app/**', '.github/workflows/flutter-ci.yml']

permissions:
  contents: read

jobs:
  triage-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Component B screens and tests
        run: >-
          flutter analyze --no-pub
          lib/screens/submit_triage_screen.dart
          lib/screens/triage_dashboard_screen.dart
          lib/services/triage_repository.dart
          test/triage_screens_test.dart
          test/widget_test.dart
      - name: Run Flutter tests
        run: flutter test --no-pub
