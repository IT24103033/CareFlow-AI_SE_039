name: React Web CI

on:
  push:
    branches:
      - main
      - feature/*
      - fix/*
    paths:
      - 'web-admin/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web-admin/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Build validation
        run: npm run build
