name: ASP.NET Core Backend CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore backend-api/CareFlowAI.API.csproj

    - name: Build Solution
      run: dotnet build backend-api/CareFlowAI.API.csproj --no-restore --configuration Release

    - name: Run Backend Tests
      run: dotnet test backend-api.Tests/CareFlowAI.API.Tests.csproj --configuration Release --verbosity normal

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run Triage Client Contract Tests
      run: npm test --prefix web-admin
